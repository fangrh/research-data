<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResearchData · Three Interact</title><link rel="stylesheet" href="style.css">
<style>
html,body{height:760px;min-height:0;background:#f8fafc;color:#172b4d}body{display:flex;flex-direction:column}
.proof-menu{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 12px;background:#fff;border-bottom:1px solid #e2e8f0;font:13px system-ui;flex-shrink:0}
.proof-menu button{border:1px solid #cad5e2;background:white;color:#172b4d;border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap;width:auto;height:auto;min-width:max-content;flex:0 0 auto;line-height:1.3}.proof-menu .primary{background:#00aeec;color:white;border-color:#00aeec}
.proof-menu small{margin-left:auto;color:#64748b}.proof-source{position:fixed;inset:8%;z-index:500;padding:16px;background:white;box-shadow:0 12px 60px #0005;display:flex;flex-direction:column;gap:8px}.proof-source[hidden]{display:none}.proof-source textarea{flex:1;min-height:200px;font:12px monospace}.proof-source button{align-self:flex-end}
@media(max-width:650px){.proof-menu{padding:6px;gap:4px}.proof-menu small{width:100%;margin:0}.proof-menu button{padding:5px 8px}}
</style></head><body><script src="plotly.min.js"></script><script src="host.js"></script><script src="editor.js"></script></body></html>
