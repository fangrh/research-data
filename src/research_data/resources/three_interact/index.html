<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResearchData · Three Interact</title><link rel="stylesheet" href="style.css">
<style>
html,body{height:760px;min-height:0}body{display:flex;flex-direction:column;background:var(--ti-bg,#f6f7f9);color:var(--ti-fg,#172b4d)}body[data-hosted="true"] header[data-host-hidden="true"]{display:none}
body[data-theme="light"]{--ti-bg:#fff;--ti-panel:#f6f7f9;--ti-panel-alt:#eef3f7;--ti-canvas:#fff;--ti-input:#fff;--ti-button:#fff;--ti-hover:#e9f7fc;--ti-border:#d7e1e8;--ti-grid:#d7e1e8;--ti-fg:#172b4d;--ti-muted:#526273;--ti-faint:#68798a;--ti-accent:#00aeec;--ti-selection:#d7f3fb;--ti-selection-fg:#172b4d;--ti-primary-bg:#00aeec;--ti-primary-fg:#fff;color-scheme:light}
body[data-theme="black"]{--ti-accent:#6bd7ff;--ti-primary-bg:#00aeec;--ti-primary-fg:#04131a;color-scheme:dark}
.proof-menu{color:var(--ti-fg,#172b4d);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;background:var(--ti-panel,#fff);border-bottom:1px solid var(--ti-border,#d7e1e8);font:13px system-ui,sans-serif;flex-shrink:0}.proof-label{font-weight:650;color:var(--ti-muted,#526273);padding:0 3px 0 1px}.proof-group{display:inline-flex;align-items:center;gap:4px;padding-left:6px;border-left:1px solid var(--ti-border,#e2e8f0)}.proof-menu button{border:1px solid var(--ti-border,#c9d6df);background:var(--ti-button,#fff);color:var(--ti-fg,#172b4d);border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap;width:auto;height:auto;min-width:max-content;flex:0 0 auto;line-height:1.25}.proof-menu button:disabled{cursor:wait;opacity:.55}.proof-menu[aria-busy="true"]{box-shadow:inset 0 -2px #00aeec}.proof-menu .primary{background:#00aeec;color:white;border-color:#00aeec}.proof-menu small{margin-left:auto;color:var(--ti-muted,#526273);min-width:12rem}.proof-source{position:fixed;inset:8%;z-index:500;padding:16px;background:var(--ti-panel,#fff);color:var(--ti-fg,#172b4d);box-shadow:0 12px 60px #0005;display:flex;flex-direction:column;gap:8px}.proof-source[hidden]{display:none}.proof-source textarea{flex:1;min-height:200px;font:12px monospace}.proof-source button{align-self:flex-end}
@media(max-width:650px){.proof-menu{padding:6px;gap:4px}.proof-label{width:100%}.proof-group{padding-left:4px}.proof-menu small{width:100%;min-width:0;margin:0}.proof-menu button{padding:5px 8px}}
.proof-upstream{padding-left:4px}.proof-upstream nav{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
</style></head><body><script src="plotly.min.js"></script><script src="host.js"></script><script src="editor.js"></script></body></html>
